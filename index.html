<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP da Nicolly - Área Exclusiva</title>
    <link rel="stylesheet" href="style.css"> <!-- Seu arquivo de estilo -->
</head>
<body style="background: #0b0f19; color: #fff; font-family: sans-serif; margin: 0; padding: 0;">

    <!-- CABEÇALHO / HEADER -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <h1 style="font-size: 1.5rem; color: #ec4899; margin: 0;">VIP da Nicolly ✨</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="user-status-badge" style="padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: rgba(255,255,255,0.1); color: #9ca3af;">Visitante</span>
            <button id="btn-abrir-login" class="btn-primary" style="background: #ec4899; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Entrar / Criar Conta</button>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 0 auto; padding: 30px 20px;">

        <!-- 1. SEÇÃO VITRINE (Pública / Planos) -->
        <section id="vitrine-section">
            <div style="text-align: center; margin-bottom: 40px;">
                <h2 style="font-size: 2.2rem; margin-bottom: 10px;">Conteúdo Exclusivo e Privado</h2>
                <p style="color: #9ca3af; font-size: 1rem;">Escolha um plano abaixo, assine com Pix via Mercado Pago e tenha acesso imediato!</p>
            </div>
            <!-- Container onde os planos do Supabase aparecem dinamicamente -->
            <div id="planos-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;"></div>
        </section>

        <!-- 2. SEÇÃO ÁREA DO CLIENTE VIP -->
        <section id="cliente-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <div>
                    <h2 id="cliente-welcome-title" style="font-size: 1.8rem; color: #fff; margin: 0;">Olá, Membro VIP!</h2>
                    <p style="color: #9ca3af; font-size: 0.9rem; margin-top: 5px;">Aproveite todos os conteúdos exclusivos liberados para você.</p>
                </div>
                <button id="btn-sair-cliente" style="background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Sair da Conta</button>
            </div>

            <!-- Notificações do Cliente -->
            <div id="cliente-notificacoes-container" style="margin-bottom: 25px;"></div>

            <!-- Galeria de Mídias VIP (Fotos, Vídeos, Curtidas, Favoritos) -->
            <div id="galeria-vip-container"></div>
        </section>

        <!-- 3. SEÇÃO PAINEL ADMIN MASTER -->
        <section id="admin-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="font-size: 1.8rem; color: #10b981; margin: 0;">Painel Administrativo Master</h2>
                <button id="btn-logout-admin" style="background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Sair do Painel</button>
            </div>

            <!-- Estatísticas Financeiras e de Acessos -->
            <div id="admin-stats-container" style="margin-bottom: 30px;"></div>

            <!-- Formulário de Upload de Mídias para o Storage -->
            <div style="background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; margin-top: 20px;">
                <h3 style="color: #fff; font-size: 1.2rem; margin-bottom: 15px;">Publicar Novo Conteúdo VIP</h3>
                <form id="form-upload-vip" style="display: flex; flexDirection: column; gap: 15px;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">Título da Publicação</label>
                        <input type="text" id="midia-titulo" required placeholder="Ex: Ensaio Exclusivo #01" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">Descrição (Opcional)</label>
                        <textarea id="midia-descricao" placeholder="Detalhes sobre o conteúdo..." style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; height: 80px;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">Arquivo de Mídia (Foto ou Vídeo)</label>
                        <input type="file" id="midia-arquivo" accept="image/*,video/*" required style="color: #fff;">
                    </div>
                    <button type="submit" id="btn-enviar-midia" class="btn-primary" style="background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;">Publicar no Supabase Storage</button>
                </form>
            </div>
        </section>

    </main>

    <!-- MODAL DE LOGIN / CADASTRO -->
    <div id="modal-login" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: #111827; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 30px; width: 100%; max-width: 400px; position: relative;">
            <button id="btn-fechar-modal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer;">✕</button>
            
            <h3 id="modal-auth-titulo" style="color: #fff; font-size: 1.4rem; margin-bottom: 20px; text-align: center;">Acessar Plataforma</h3>
            
            <form id="form-login-unico" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">Senha</label>
                    <input type="password" id="login-senha" required placeholder="••••••••" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px;">
                </div>
                <button type="submit" id="btn-submit-auth" class="btn-primary" style="background: #ec4899; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;">Entrar na Conta</button>
            </form>

            <button type="button" id="btn-alternar-modo-auth" style="background: none; border: none; color: #38bdf8; font-size: 0.85rem; cursor: pointer; display: block; margin: 20px auto 0 auto; text-align: center;">Não tem conta? Criar conta agora</button>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL (Módulo Type) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
